project:
  name: "Demo internal exposure project"
  analyte: "As"
  country: "China"
  matrix_scope: ["Urine", "Blood", "CordBlood"]
  config_version: "1.0.0"
  contract_version: "1.0.0"

period_scheme:
  name: "four_era"
  boundaries:
    - {label: "1980-2000", start: 1980, end: 2000}
    - {label: "2001-2010", start: 2001, end: 2010}
    - {label: "2011-2020", start: 2011, end: 2020}
    - {label: "2021-2024", start: 2021, end: 2024}
  freeze_date: "2026-07-19"
  boundary_policy: "inclusive"
  out_of_range: "exclude"
  representative_year_rule: "start"

region_map:
  Southwest: ["四川省", "云南省", "贵州省", "重庆市", "西藏自治区"]
  Northwest: ["陕西省", "甘肃省", "青海省", "宁夏回族自治区", "新疆维吾尔自治区"]
  North: ["北京市", "天津市", "河北省", "山西省", "内蒙古自治区"]
  Central: ["河南省", "湖北省", "湖南省"]
  East: ["上海市", "江苏省", "浙江省", "安徽省", "福建省", "江西省", "山东省", "台湾省"]
  South: ["广东省", "广西壮族自治区", "海南省", "香港特别行政区", "澳门特别行政区"]
  Northeast: ["辽宁省", "吉林省", "黑龙江省"]

unit_policy:
  Urine: {target: "ug/g Cr"}
  Blood: {target: "ug/L"}
  CordBlood: {target: "ug/L"}
  default_conflict_resolution: "prefer_creatinine_corrected"

# =============================================================================
# 标准化口径（★ 必需区块：三键都必填，缺失即硬错误）
#
# 为什么必需而非可选：三者都被 S4 依赖。若设为可选，某脚本路径可能不读它而
# 用内置默认值 —— 那就重蹈"兜底"的覆辙（看起来跑通、但口径是错的）。
# 显式配置成本三行 YAML，漏配的代价是静默的口径不一致。
# =============================================================================
standardization:

  # ① 中位数如何转 GM
  #    as_gm  —— 直接把中位数当作 GM（对数正态下中位数 = 几何均值）；更稳，常用
  #    via_wan —— 经 Wan 公式先估 Mean/SD 再转 GM；能得到 GSD，但引入估算误差
  #    影响：改变 gm_summary 与 gsd_summary → 改变所有分层结果与「仅直接报告 GM」子集
  #    改动后果：须 bump config_version 并重算 S4 → S5 → S6
  median_to_gm_strategy: "as_gm"

  # ② Wan S1–S5 公式的 ± 变体
  #    minus —— 减号变体（保守）；本工作包默认，与主流实现一致
  #    ⚠️ plus **尚未实现**：Wan 2014 的 ± 变体在 n 较小时数值分支不同，
  #       本工作包只做了减号变体；填 "plus" 会被 project_config 拒绝，
  #       即便绕过校验，wan_convert.py 也会**显式抛错**（不做静默等价）。
  #    影响：改变由 Wan 估算得到的 SD/GSD → 影响误差线与敏感性分层
  #    改动后果：须 bump config_version 并重算
  wan_variant: "minus"

  # ③ 尿校正路径（两条数学等价路径，但参数舍入不同）
  #    CC_direct     —— 浓度(μg/L) ÷ 肌酐浓度 CC(g/L)
  #    CEV_equivalent—— 浓度(μg/L) × 每日尿量 V ÷ 每日肌酐排泄量 CE
  #    影响：参数表 4 位小数下两条路径相差约 0.03%；
  #          参数不自洽的人群档（如 Minors，CC=0.815 vs CE/V=0.881）可达 8%
  #    约束：同一项目内**不得混用**；改动须 bump config_version 并重算
  creatinine_path_mode: "CC_direct"

weighting:
  method: "sample_size"
  log_base: "natural"
  percentile_method: "weighted"

validation:
  verified_ratio_threshold: 0.90

urine_reference:
  source: "ICRP Publication 89"
  table:
    - {population_group: "Infant",     age: 1,  ce_g_day: 0.11,  volume_l_day: 0.4,  creat_g_l: 0.275}
    - {population_group: "Adults",     age: 18, ce_g_day: 1.35,  volume_l_day: 1.4,  creat_g_l: 0.964}
    - {population_group: "Adult_Male", age: 18, sex: "Male",   ce_g_day: 1.7,  volume_l_day: 1.6, creat_g_l: 1.063}
    - {population_group: "Adult_Female", age: 18, sex: "Female", ce_g_day: 1.0, volume_l_day: 1.2, creat_g_l: 0.833}
    - {population_group: "Minors",     age: null, ce_g_day: 0.925, volume_l_day: 1.05, creat_g_l: 0.815}
    - {population_group: "Pregnant",   age: null, sex: "Female", ce_g_day: 1.275, volume_l_day: 2.0, creat_g_l: 0.638, source: "NHANES"}

edi:
  absorption_fraction_ABS: 0.7
  body_weight:
    Adults: 60.0
    Pregnant: 60.0
    Minors: 20.0
    Elderly: 60.0
  urine_route:
    method_primary: "creatinine_excretion"
    method_secondary: "urine_volume"
  blood_route:
    vd_l_per_kg: 2.0
    tau_day: 1.0
    formula: "(BAs * Vd) / (ABS * tau)"
    interpretation: "exploratory"
  cordblood_route:
    enabled: false
    reason: "缺乏胎儿/新生儿药代动力学参数 → 方案 A：跳过并计数"
# =============================================================================
# 检索策略（★ 条件必需区块：使用 S1 的 generate_search_terms.py 时必需，
# 缺失即硬错误。其余脚本不读取本区块。）
#
# databases 两条形态（可混用）：
#   - 字符串（纯库名）：generate_search_terms.py 据词表生成检索式草稿
#   - 映射（如下）：name + 检索执行元数据。search_string / records_exported /
#     export_file 是 **人工在 GATE-1 登记的执行记录位**；权威执行记录仍是
#     source_summary.csv / 01-search/检索记录.csv（AI 不代填）。
# date_range 为发表年过滤窗口 —— 与 period_scheme 的"采样年"分期是两回事。
# language_filter：PubMed/WoS 草稿自动接入语言过滤（en/zh）。
# analytes/matrices/exposure_terms/population_keywords/exclusion_terms 为
# 检索词表（草稿原料）；synonyms_zh 供中文库，缺失则中文库输出"待人工补充"。
# =============================================================================
search:
  databases:
    - name: PubMed
      search_string: ""
      records_exported: 0
      export_format: ris
      export_file: ""
    - name: "Web of Science"
      search_string: ""
      records_exported: 0
      export_format: xml
      export_file: ""
    - name: Scopus
      search_string: ""
      records_exported: 0
      export_format: ris
      export_file: ""
    - name: Embase
      search_string: ""
      records_exported: 0
      export_format: ris
      export_file: ""
    - name: CNKI
      search_string: ""
      records_exported: 0
      export_format: enl
      export_file: ""
    - name: Wanfang
      search_string: ""
      records_exported: 0
      export_format: ris
      export_file: ""
  date_range:
    start_year: 1980
    end_year: 2024
  language_filter: [en, zh]
  analytes:
    - name: "arsenic"
      mesh: ["Arsenic", "Arsenic Poisoning"]
      synonyms: ["arsenic", "arsenic*", "inorganic arsenic", "total arsenic"]
      synonyms_zh: ["砷", "总砷", "无机砷", "尿砷", "血砷"]
  matrices:
    - name: "urine"
      mesh: ["Urine"]
      synonyms: ["urine", "urinary", "urinalysis"]
      synonyms_zh: ["尿", "尿液", "尿样"]
    - name: "blood"
      mesh: ["Blood", "Cord Blood"]
      synonyms: ["blood", "cord blood", "serum", "plasma"]
      synonyms_zh: ["血", "血液", "脐带血", "血清", "血浆"]
  exposure_terms: ["human biomonitoring", "biological monitoring", "internal exposure",
                   "exposure assessment", "biomonitoring"]
  population_keywords: ["general population", "adults", "children", "pregnant women",
                        "residents", "community-dwelling"]
  exclusion_terms:
    animal: ["mice", "mouse", "rats", "zebrafish", "in vivo"]
    cell: ["in vitro", "cell line", "cell culture"]
    occupational: ["workers", "occupational exposure", "smelter", "miners"]
    clinical: ["case report", "case reports", "clinical trial"]

# =============================================================================
# 筛选质控（★ 条件必需区块：使用 S2 的任一脚本时必需，缺失即硬错误。
# 其余脚本不读取本区块。）
#
# 这里承载 S2 的全部闭集与阈值 —— 分类规则、排除原因、去重参数都可扩展，
# 但必须显式配置（代码里零字面量、零默认值）。改动 = 改筛选口径：
# 须 bump config_version 并复跑 S2 全流程（stale 回滚）。
#
# 状态机：raw → deduplicated → title_abstract_reviewed → fulltext_retrieved
#         → fulltext_reviewed → included / excluded（uncertain 为中间态；
#         被排除的记录不物理删除）
# 人工闸门：GATE-S2a（原始数据验收）/ GATE-S2b（题摘裁决）/ GATE-S2c（全文终裁）
# =============================================================================
screening:
  dedup:
    similarity_threshold: 0.85     # 词 bigram Jaccard 阈值；(0, 1]
                                   # （别名 title_similarity_threshold，二选一）
    author_match_required: true    # 模糊聚簇是否要求第一作者一致
    year_tolerance: 0              # 模糊聚簇允许的年份差（任一年份缺失则放行）
    match_levels:                  # 声明式级别清单；method 必须在已实现闭集内
      - {level: 1, method: doi_exact}
      - {level: 2, method: pmid_exact}
      - {level: 3, method: title_author_year_fuzzy}
  min_text_chars: 40               # 题摘文本低于此长度 → insufficient_info
  analyte_terms:                   # 分类与全文核对用的分析物词（小写匹配）
    - "arsenic"
    - "砷"
  article_types:                   # 文章类型闭集（含两个保留类型）
    - human_hbm_original
    - human_non_hbm
    - review
    - animal_study
    - in_vitro_study
    - methodology
    - policy_or_comment
    - other
    - insufficient_info
  meta_analysis_disposition:       # 定量处理意见闭集（included/excluded 清单的
    - include                      # meta_disposition 列；"分类 ≠ 处理意见"——
    - exclude                      # 综述可 background_only，动物实验可机制引用）
    - background_only
    - citation_tracking_only
    - uncertain
  type_decision_map:               # 类型 → 题摘 AI 建议（必须全覆盖）
    human_hbm_original: "proceed_to_fulltext"
    human_non_hbm: "uncertain"
    review: "suggest_exclude"
    animal_study: "suggest_exclude"
    in_vitro_study: "suggest_exclude"
    methodology: "uncertain"
    policy_or_comment: "suggest_exclude"
    other: "uncertain"
    insufficient_info: "uncertain"
  classification_rules:            # 关键词组格式（v2 模板形态）：
    review_keywords:               # 按固定顺序编译为 title_any 规则
      - review                     # （review → animal → in_vitro → methodology
      - meta-analysis              #   → policy → hbm），先命中先判。
      - systematic review          # 亦支持有序规则列表格式（每条
      - overview                   #   {id, type, title_any, abstract_any,
    animal_keywords:               #   require_analyte}）——表达力更强，见
      - rats                       #   skills/S2-screening-quality/SKILL.md。
      - mouse                      # ⚠️ 动物词用 rats 而非 rat：子串匹配下
      - mice                       #   "rat" 会误伤 rate / moderate 等词。
      - animal
      - in vivo
      - rodent
    in_vitro_keywords:
      - cell line
      - in vitro
      - cell culture
    hbm_keywords:
      - biomonitoring
      - urinary
      - urine
      - blood
      - serum
      - plasma
      - breast milk
      - cord blood
      - hair
  exclusion_reason_codes:          # 全文排除原因闭集（判定标准见
    - not_human_study              #   skills/S2-screening-quality/references/
    - wrong_analyte                #   exclusion_reasons.md）；insufficient_info
    - no_hbm_data                  # 与 fulltext_unavailable 为保留编码（必含）
    - no_usable_values
    - wrong_population
    - wrong_year
    - duplicate_cohort
    - review_or_comment
    - conference_abstract
    - fulltext_unavailable
    - insufficient_info
  fulltext_rules:                  # 全文四问的词表
    human_sample_terms: ["participants", "subjects", "residents", "pregnant",
                         "children", "adults", "newborns", "volunteers",
                         "人群", "居民", "孕妇", "儿童", "受试者"]
    concentration_stat_terms: ["geometric mean", "arithmetic mean", "median",
                               "95% ci", "standard deviation", "ug/l", "μg/l",
                               "ng/ml", "μg/g", "ng/g", "几何均值", "中位数", "均值"]
